name: Run reproducer on each commit
on: [push, workflow_dispatch]
jobs:
  gradle:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: microsoft
        java-version: 17

    - name: Install the Microsoft Build of OpenJDK 25 with its MSI
      run: |
        Invoke-WebRequest https://aka.ms/download-jdk/microsoft-jdk-25-windows-x64.msi -OutFile jdk-25.msi
        Start-Process msiexec -ArgumentList '/i', 'jdk-25.msi', '/quiet', '/norestart' -Wait
        reg query HKLM\SOFTWARE\Microsoft\JDK /s /v Path

    - name: Run the build with an empty Gradle user home
      run: ./gradlew.bat -g "${{ runner.temp }}/empty-gradle-user-home" help
